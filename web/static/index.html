<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEIA · Análisis Energético</title>
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --panel-2: #222b35;
    --border: #2d3947;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #2dd4a7;
    --accent-dim: #1a9c7a;
    --user: #2563eb;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #0ea5e9);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06281f; font-size: 17px;
  }
  header h1 { font-size: 16px; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  header .spacer { flex: 1; }
  select, .btn-reset {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  select:focus { outline: 1px solid var(--accent); }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 820px; width: 100%; margin: 0 auto; display: flex; gap: 10px; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .msg.user .avatar { background: var(--user); color: #fff; }
  .msg.agent .avatar { background: linear-gradient(135deg, var(--accent), #0ea5e9); color: #06281f; }
  .msg .body {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.6;
    overflow-x: auto;
  }
  .msg.user .body { background: #1c2a42; border-color: #2c3e5f; }
  .msg .body table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .msg .body th, .msg .body td { border: 1px solid var(--border); padding: 5px 10px; }
  .msg .body th { background: var(--panel-2); }
  .msg .body pre { background: var(--panel-2); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .msg .body code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .msg .body h1, .msg .body h2, .msg .body h3 { margin: 10px 0 6px; font-size: 15px; }
  .msg .body ul, .msg .body ol { padding-left: 20px; }
  .chart {
    width: 100%; height: 320px; margin-top: 12px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
  }
  details.sql {
    margin-top: 10px; font-size: 12px; color: var(--muted);
  }
  details.sql summary { cursor: pointer; user-select: none; }
  details.sql pre { margin-top: 6px; color: var(--muted); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .error-box { color: var(--danger); font-size: 13px; margin-top: 8px; }

  #suggestions {
    display: flex; gap: 8px; flex-wrap: wrap;
    max-width: 820px; margin: 0 auto; padding: 0 0 4px; width: 100%;
  }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px; padding: 6px 13px;
    font-size: 12.5px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  #inputbar {
    padding: 12px 20px 16px; background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #inputbar .inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  #question {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-size: 14px; resize: none; font-family: inherit;
  }
  #question:focus { outline: 1px solid var(--accent); }
  #send {
    background: var(--accent); color: #06281f; border: none;
    border-radius: 10px; padding: 0 22px; font-size: 14px;
    font-weight: 700; cursor: pointer;
  }
  #send:disabled { background: var(--border); color: var(--muted); cursor: wait; }
  #mic {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0 14px; font-size: 17px; cursor: pointer;
    user-select: none; touch-action: none; -webkit-user-select: none;
  }
  #mic.recording { background: var(--danger); border-color: var(--danger); color: #fff; }
  #mic:disabled { opacity: .35; cursor: not-allowed; }
  #voicestatus {
    max-width: 820px; margin: 0 auto 6px; width: 100%;
    font-size: 12.5px; color: var(--accent); min-height: 16px;
  }
  .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s }
  .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes bounce { 0%,60%,100%{opacity:.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }
</style>
</head>
<body>
<header>
  <div class="logo">Z</div>
  <h1>ZEIA <span>Análisis de consumo energético</span></h1>
  <div class="spacer"></div>
  <select id="model"></select>
  <button class="btn-reset" id="reset">Nueva conversación</button>
</header>

<div id="chat"></div>

<div id="inputbar">
  <div id="suggestions"></div>
  <div id="voicestatus"></div>
  <div class="inner">
    <textarea id="question" rows="1" placeholder="Pregunta sobre consumo, alertas, ahorro… (Enter para enviar)"></textarea>
    <button id="mic" title="Iniciar conversación por voz">🎙</button>
    <button id="send">Enviar</button>
  </div>
</div>

<script>
const SUGGESTIONS = [
  "¿Qué empresas están monitoreando y cuántos circuitos tiene cada una?",
  "¿Cuál fue el consumo de Sanna San Borja ayer? Detalla por punto principal",
  "¿Cómo es la curva de carga horaria de Oechsle esta semana?",
  "¿Hubo alertas críticas esta semana? ¿De qué tipo y dónde?",
  "¿Qué porcentaje del consumo de Oechsle ocurre en horas punta este mes?",
  "¿Hay consumo anómalo de madrugada en alguna sede?",
  "¿Alguna sede está pagando potencia contratada de más?",
  "Compara las facturas mensuales 2025 (enero–diciembre): patrones, anomalías y tendencia de costo",
];

let sessionId = localStorage.getItem('zeia_session') || null;
const chat = document.getElementById('chat');
const q = document.getElementById('question');
const sendBtn = document.getElementById('send');
const modelSel = document.getElementById('model');

marked.setOptions({ breaks: true });

async function initModels() {
  const res = await fetch('/api/models');
  const data = await res.json();
  data.options.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.id; opt.textContent = m.label;
    if (m.id === data.default) opt.selected = true;
    modelSel.appendChild(opt);
  });
}

function renderChart(el, spec) {
  if (typeof echarts === 'undefined') {
    el.innerHTML = '<div style="padding:20px;color:#f87171;font-size:13px">No se pudo cargar la librería de gráficos.</div>';
    return;
  }
  const c = echarts.init(el, 'dark');
  const palette = ['#2dd4a7', '#0ea5e9', '#f59e0b', '#a78bfa', '#f87171'];
  let option;
  if (spec.chart_type === 'pie') {
    const s = spec.series[0] || { data: [] };
    option = {
      backgroundColor: 'transparent', color: palette,
      title: { text: spec.title, left: 'center', textStyle: { fontSize: 14 } },
      tooltip: { trigger: 'item', valueFormatter: v => v + (spec.y_unit ? ' ' + spec.y_unit : '') },
      series: [{
        type: 'pie', radius: ['40%', '68%'],
        data: (spec.x || []).map((name, i) => ({ name, value: s.data[i] })),
        label: { color: '#e6edf3' }
      }]
    };
  } else {
    option = {
      backgroundColor: 'transparent', color: palette,
      title: { text: spec.title, left: 'center', textStyle: { fontSize: 14 } },
      tooltip: { trigger: 'axis' },
      legend: { bottom: 0, textStyle: { color: '#8b98a5' } },
      grid: { top: 44, left: 56, right: 20, bottom: 44 },
      xAxis: { type: 'category', data: spec.x || [] },
      yAxis: { type: 'value', name: spec.y_unit || '' },
      series: (spec.series || []).map(s => ({
        name: s.name, data: s.data,
        type: spec.chart_type === 'bar' ? 'bar' : 'line',
        smooth: true,
        areaStyle: spec.chart_type === 'area' ? { opacity: 0.25 } : undefined,
      }))
    };
  }
  c.setOption(option);
  window.addEventListener('resize', () => c.resize());
}

function addMessage(role, content, extras = {}) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? 'Tú' : 'Z';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="body"></div>`;
  const body = div.querySelector('.body');
  if (role === 'agent') {
    body.innerHTML = marked.parse(content || '_(sin respuesta)_');
  } else {
    body.textContent = content;
  }
  (extras.charts || []).forEach(spec => {
    const el = document.createElement('div');
    el.className = 'chart';
    body.appendChild(el);
    try {
      renderChart(el, spec);
    } catch (e) {
      console.error('chart error', e, spec);
      el.innerHTML = `<div style="padding:20px;color:#f87171;font-size:13px">No se pudo graficar: ${e.message}</div>`;
    }
  });
  if (extras.queries && extras.queries.length) {
    const det = document.createElement('details');
    det.className = 'sql';
    det.innerHTML = `<summary>Ver ${extras.queries.length} consulta(s) SQL</summary>` +
      extras.queries.map(x => `<pre><code></code></pre>`).join('');
    det.querySelectorAll('code').forEach((c, i) => c.textContent = extras.queries[i]);
    body.appendChild(det);
  }
  if (extras.usage && (extras.usage.prompt_tokens || extras.usage.completion_tokens)) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `tokens: ${extras.usage.prompt_tokens} in / ${extras.usage.completion_tokens} out`;
    body.appendChild(meta);
  }
  if (extras.error && extras.error !== 'max_iterations') {
    const err = document.createElement('div');
    err.className = 'error-box';
    err.textContent = extras.error;
    body.appendChild(err);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg agent'; div.id = 'typing';
  div.innerHTML = `<div class="avatar">Z</div><div class="body"><span class="typing"><i></i><i></i><i></i></span></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send(text, viaVoice = false) {
  const message = (text ?? q.value).trim();
  if (!message) return;
  q.value = '';
  sendBtn.disabled = true;
  document.getElementById('suggestions').style.display = 'none';
  addMessage('user', message);
  addTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: sessionId, model: modelSel.value }),
    });
    const data = await res.json();
    document.getElementById('typing').remove();
    if (!res.ok) {
      addMessage('agent', 'Ocurrió un error procesando tu pregunta.', { error: data.detail });
    } else {
      sessionId = data.session_id;
      localStorage.setItem('zeia_session', sessionId);
      addMessage('agent', data.answer, data);
      if (viaVoice) speakAnswer(data.answer);
    }
  } catch (e) {
    document.getElementById('typing').remove();
    addMessage('agent', 'No pude conectarme con el servidor.', { error: String(e) });
  }
  sendBtn.disabled = false;
  q.focus();
}

sendBtn.onclick = () => send();
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId }),
  });
  chat.innerHTML = '';
  showSuggestions();
};

function showSuggestions() {
  const box = document.getElementById('suggestions');
  box.style.display = 'flex';
  box.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = s;
    chip.onclick = () => send(s);
    box.appendChild(chip);
  });
}

// --- Voz: modo conversación con detección de voz (VAD) ---
const micBtn = document.getElementById('mic');
const vstatus = document.getElementById('voicestatus');
let convoOn = false, convoStream = null, audioCtx = null, analyser = null;
let speaking = false, silenceStart = 0, vadRecorder = null, vadChunks = [], vadMime = '';
let currentAudio = null, voiceBusy = false;  // voiceBusy: transcribiendo/pensando

const VAD_THRESHOLD = 0.02;    // energía RMS mínima para considerar habla
const SILENCE_MS = 1300;       // silencio que cierra el turno del usuario
const MIN_AUDIO_BYTES = 1500;  // descarta ruidos cortos (< ~1 s de audio)

function setVStatus(t) { vstatus.textContent = t || ''; }

function stopAudio() {
  if (currentAudio) { currentAudio.pause(); URL.revokeObjectURL(currentAudio.src); currentAudio = null; }
}

async function speakAnswer(text) {
  try {
    const res = await fetch('/api/voice/speak', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) return;  // el detalle completo ya está en pantalla
    const blob = await res.blob();
    stopAudio();
    currentAudio = new Audio(URL.createObjectURL(blob));
    currentAudio.play();
  } catch { /* la respuesta queda solo en pantalla */ }
}

function startUtterance() {
  vadChunks = [];
  vadRecorder = new MediaRecorder(convoStream, vadMime ? { mimeType: vadMime } : undefined);
  vadRecorder.ondataavailable = ev => { if (ev.data.size) vadChunks.push(ev.data); };
  vadRecorder.onstop = onUtteranceStop;
  vadRecorder.start();
}

function endUtterance() {
  if (vadRecorder && vadRecorder.state !== 'inactive') vadRecorder.stop();
  vadRecorder = null;
}

async function onUtteranceStop() {
  if (!convoOn) return;
  const blob = new Blob(vadChunks, { type: vadMime || 'audio/webm' });
  vadChunks = [];
  if (blob.size < MIN_AUDIO_BYTES) { setVStatus('Escuchando…'); return; }
  voiceBusy = true;
  setVStatus('Transcribiendo…');
  try {
    const res = await fetch('/api/voice/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': blob.type || 'audio/webm' },
      body: blob,
    });
    const data = await res.json();
    if (res.ok && data.text) {
      setVStatus('ZEIA está pensando…');
      await send(data.text, true);  // send() llama speakAnswer() al terminar
    } else if (!res.ok) {
      addMessage('agent', 'No pude transcribir el audio.', { error: data.detail });
    } else {
      setVStatus('No escuché nada, intenta de nuevo');
      await new Promise(r => setTimeout(r, 1200));
    }
  } catch (e) {
    addMessage('agent', 'No pude conectarme con el servidor.', { error: String(e) });
  }
  voiceBusy = false;
  if (convoOn) setVStatus('Escuchando…');
}

function vadTick() {
  if (!convoOn || !analyser) return;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  const loud = Math.sqrt(s / buf.length) > VAD_THRESHOLD;
  const now = performance.now();
  if (voiceBusy) {
    speaking = false; silenceStart = 0;
  } else if (!speaking && loud) {
    speaking = true; silenceStart = 0;
    stopAudio();  // barge-in: hablar interrumpe la voz de ZEIA
    setVStatus('Te escucho…');
    startUtterance();
  } else if (speaking) {
    if (loud) {
      silenceStart = 0;
    } else {
      if (!silenceStart) silenceStart = now;
      if (now - silenceStart > SILENCE_MS) {
        speaking = false; silenceStart = 0;
        endUtterance();
      }
    }
  }
  requestAnimationFrame(vadTick);
}

async function startConvo() {
  try {
    convoStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch {
    addMessage('agent', 'No pude acceder al micrófono. Revisa los permisos del navegador.');
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  audioCtx.createMediaStreamSource(convoStream).connect(analyser);
  vadMime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
          : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
  convoOn = true;
  micBtn.classList.add('recording');
  micBtn.textContent = '⏹';
  micBtn.title = 'Terminar la conversación';
  setVStatus('Escuchando… habla cuando quieras');
  requestAnimationFrame(vadTick);
}

function stopConvo() {
  convoOn = false; speaking = false;
  endUtterance();
  if (convoStream) { convoStream.getTracks().forEach(t => t.stop()); convoStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  stopAudio();
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎙';
  micBtn.title = 'Iniciar conversación por voz';
  setVStatus('');
}

micBtn.onclick = () => (convoOn ? stopConvo() : startConvo());

async function initVoice() {
  try {
    const res = await fetch('/api/voice/status');
    const data = await res.json();
    if (!data.enabled) {
      micBtn.disabled = true;
      micBtn.title = 'Voz deshabilitada: falta ELEVENLABS_API_KEY en .env';
    }
  } catch { micBtn.disabled = true; }
}

initModels();
initVoice();
showSuggestions();
addMessage('agent', 'Hola, soy **ZEIA**, tu analista de energía. Puedo responder sobre consumo, costos, alertas y oportunidades de ahorro de las sedes monitoreadas. ¿Qué te gustaría saber?');
</script>
</body>
</html>
