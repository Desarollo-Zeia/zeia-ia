# Agente ZEIA: proxy inverso hacia uvicorn (127.0.0.1:8000).
# Ajusta server_name al subdominio elegido antes de certbot.
server {
    listen 80;
    server_name agent.energy.zeia.com.pe;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming (SSE) y consultas del agente que tardan 10-100 s
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
